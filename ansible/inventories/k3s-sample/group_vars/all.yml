---
# ==============================================================================
# OpenIaC Global Configuration (Lightweight Kubernetes — K3s)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Deployment Mode & Engine
# ------------------------------------------------------------------------------
# Set to 'true' for air-gapped environments (requires artifacts in packager/artifacts/k3s)
airgapped_mode: false
k3s_install_method: "binary"

# ------------------------------------------------------------------------------
# 2. SUSE Rancher K3s Configuration
# ------------------------------------------------------------------------------
k3s_version: "v1.28.4+k3s2"

# ------------------------------------------------------------------------------
# 3. Layer-3 Add-ons & Day-2 Lifecycle (KubeVirt Cloud-Native Virtualization)
# ------------------------------------------------------------------------------
# Set enable_kubevirt_addon: true to automatically install KubeVirt during 'make k3s'
enable_kubevirt_addon: false
kubevirt_state: "present"
kubevirt_version: "v1.2.0"
