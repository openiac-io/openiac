---
# ==============================================================================
# OpenIaC Global Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Deployment Mode
# ------------------------------------------------------------------------------
# Set to 'true' if the target servers have NO internet access.
# If true, you MUST place the required offline artifacts in packager/artifacts/
airgapped_mode: true

# ------------------------------------------------------------------------------
# 2. Kubernetes (K3s) Configuration
# ------------------------------------------------------------------------------
# The specific version of K3s to install.
# You can use ANY valid K3s release tag from the official GitHub releases page:
# 👉 https://github.com/k3s-io/k3s/releases
#
# Note: Ensure the version string exactly matches the GitHub tag (e.g., v1.28.4+k3s2)
# If airgapped_mode=true, the offline artifacts for this exact version must exist.
k3s_version: "v1.28.4+k3s2"


