# OpenIaC Sample Inventory

[all:vars]
ansible_user=root
# Flag to determine if installation is online or air-gapped
airgapped_mode=false 

# ------------------------------------------------------------------------------
# 1. PHYSICAL NODES (Baremetal/Virtual Machine List)
# ------------------------------------------------------------------------------
[all_nodes]
infra-01 ansible_host=192.168.100.10
infra-02 ansible_host=192.168.100.11
infra-03 ansible_host=192.168.100.12
compute-01 ansible_host=192.168.100.20
compute-02 ansible_host=192.168.100.21

# ==============================================================================
# 🐳 KUBERNETES (K3s / OKD) TOPOLOGY
# ==============================================================================
[k8s_control_plane]
infra-01
infra-02
infra-03

[k8s_workers]
compute-01
compute-02

[k8s_cluster:children]
k8s_control_plane
k8s_workers

# ==============================================================================
# ☁️ OPENSTACK TOPOLOGY
# ==============================================================================
[os_controller]
infra-01
infra-02
infra-03

[os_compute]
compute-01
compute-02

[os_network]
infra-01
infra-02

[openstack_cluster:children]
os_controller
os_compute
os_network
