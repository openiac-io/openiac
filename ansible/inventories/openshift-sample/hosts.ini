# ==============================================================================
# OpenIaC Inventory: OpenShift / OKD Sample
# ==============================================================================
[all:vars]
ansible_user=vagrant
ansible_password=vagrant

# ------------------------------------------------------------------------------
# 1. PHYSICAL / VIRTUAL NODES
# ------------------------------------------------------------------------------
[all_nodes]
bastion-01 ansible_host=192.168.56.10
cp-01 ansible_host=192.168.56.11
worker-01 ansible_host=192.168.56.21

# ------------------------------------------------------------------------------
# 2. LOGICAL TOPOLOGY (OpenShift / OKD)
# ------------------------------------------------------------------------------
[openshift_bastion]
bastion-01

[openshift_control_plane]
cp-01

[openshift_workers]
worker-01

[openshift_cluster:children]
openshift_bastion
openshift_control_plane
openshift_workers
