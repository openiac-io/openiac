# ==============================================================================
# OpenIaC Inventory: Unified (Multi-Platform) Topology Sample
# ==============================================================================
[all:vars]
ansible_user=vagrant
ansible_password=vagrant

# ------------------------------------------------------------------------------
# 1. PHYSICAL / VIRTUAL NODES
# ------------------------------------------------------------------------------
[all_nodes]
infra-01 ansible_host=192.168.100.10
infra-02 ansible_host=192.168.100.11
compute-01 ansible_host=192.168.100.20
compute-02 ansible_host=192.168.100.21

# ------------------------------------------------------------------------------
# 2. KUBERNETES & KUBEVIRT TOPOLOGY (K8s / K3s / KubeVirt)
# ------------------------------------------------------------------------------
[k8s_control_plane]
infra-01

[k8s_workers]
compute-01
compute-02

[k8s_cluster:children]
k8s_control_plane
k8s_workers

# ------------------------------------------------------------------------------
# 3. OPENSHIFT / OKD TOPOLOGY
# ------------------------------------------------------------------------------
[openshift_bastion]
infra-01

[openshift_control_plane]
infra-02

[openshift_workers]
compute-01
compute-02

[openshift_cluster:children]
openshift_bastion
openshift_control_plane
openshift_workers
