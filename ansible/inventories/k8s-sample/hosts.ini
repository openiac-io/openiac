# ==============================================================================
# OpenIaC Inventory: Standard Upstream Kubernetes (K8s) Sample
# ==============================================================================
[all:vars]
ansible_user=vagrant
ansible_password=vagrant

# ------------------------------------------------------------------------------
# 1. PHYSICAL / VIRTUAL NODES
# ------------------------------------------------------------------------------
[all_nodes]
cp-01 ansible_host=192.168.56.10
worker-01 ansible_host=192.168.56.20
worker-02 ansible_host=192.168.56.21

# ------------------------------------------------------------------------------
# 2. LOGICAL TOPOLOGY (Kubernetes & KubeVirt)
# ------------------------------------------------------------------------------
[k8s_control_plane]
cp-01

[k8s_workers]
worker-01
worker-02

[k8s_cluster:children]
k8s_control_plane
k8s_workers
