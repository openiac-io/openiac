---
# ==============================================================================
# OpenIaC Ceph Variables (ceph-sample)
# ==============================================================================

# Ceph Version & Deployment Settings
ceph_version: "quincy"            # Target Ceph version (e.g., quincy, reef)
ceph_network: "192.168.60.0/24"   # Public network for Ceph client traffic
ceph_cluster_network: "192.168.60.0/24" # Cluster network for OSD replication

# OSD Device configuration
# Vagrant adds the secondary disk as /dev/sdb on Rocky Linux VirtualBox
osd_devices:
  - "/dev/sdb"

# Air-gapped / Offline installation flag
airgapped_mode: false
