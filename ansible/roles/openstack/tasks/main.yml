# ==============================================================================
# OpenIaC Ansible Role Entrypoint: OpenStack Private Cloud
# ==============================================================================
# Dynamically dispatches the selected OpenStack installation engine (e.g., install_kolla.yml).

# ------------------------------------------------------------------------------
# 1. Pluggable Installation Engine Dispatch
# ------------------------------------------------------------------------------
- name: "Dispatch OpenStack installation engine ({{ openstack_install_method }})"
  ansible.builtin.include_tasks: "install_{{ openstack_install_method }}.yml"
