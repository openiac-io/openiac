---
# ==============================================================================
# OpenIaC Ansible Role: OpenStack (Kolla-Ansible)
# ==============================================================================
# Deploys an enterprise-grade OpenStack private cloud on RHEL / Rocky Linux.
# Includes self-healing pre-flight setup (LVM, dummy NIC, built-in offline registry).

- name: Deploy OpenStack Private Cloud (Air-gapped or Online)
  block:
    # --------------------------------------------------------------------------
    # 1. Air-gapped (Offline) Dependencies & Built-in Local Registry
    # --------------------------------------------------------------------------
    - name: "[Offline] Install local RPM dependencies on bastion if present"
      ansible.builtin.shell: "dnf install -y --disablerepo='*' {{ playbook_dir }}/../../packager/artifacts/openstack/rpms/*.rpm"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true
      changed_when: true
      failed_when: false

    - name: "[Offline] Copy OpenStack Python wheels to bastion node"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../packager/artifacts/openstack/python/"
        dest: "/tmp/kolla-wheels/"
        mode: "0755"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true

    - name: "[Offline] Install Kolla-Ansible and OpenStackClient offline on bastion"
      ansible.builtin.command: >-
        pip3 install --no-index --find-links=/tmp/kolla-wheels/ kolla-ansible python-openstackclient
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true
      changed_when: true

    - name: "[Offline] Copy Ansible Galaxy Collections to bastion"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../packager/artifacts/openstack/collections/"
        dest: "/tmp/kolla-collections/"
        mode: "0755"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true

    - name: "[Offline] Install Kolla-Ansible Galaxy Collections offline"
      ansible.builtin.shell: >-
        ansible-galaxy collection install /tmp/kolla-collections/*.tar.gz
        -p /usr/share/ansible/collections --force
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true
      changed_when: true

    # --------------------------------------------------------------------------
    # 2. Online Dependencies Installation (Community Mode)
    # --------------------------------------------------------------------------
    - name: "[Online] Ensure Python3 pip, git, and build libraries are installed on bastion"
      ansible.builtin.dnf:
        name:
          - python3-pip
          - python3-devel
          - git
          - gcc
          - libffi-devel
          - openssl-devel
        state: present
      when: not (airgapped_mode | default(false) | bool)
      delegate_to: localhost
      run_once: true

    - name: "[Online] Install Kolla-Ansible, docker SDK, and OpenStackClient via PyPI on bastion"
      ansible.builtin.command: pip3 install "kolla-ansible>=18.0.0,<19.0.0" python-openstackclient docker dbus-python
      when: not (airgapped_mode | default(false) | bool)
      delegate_to: localhost
      run_once: true
      changed_when: true

    - name: "[Online] Install Kolla-Ansible required Ansible Galaxy collections"
      ansible.builtin.command: /usr/local/bin/kolla-ansible install-deps
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      when: not (airgapped_mode | default(false) | bool)
      delegate_to: localhost
      run_once: true
      changed_when: true

    # --------------------------------------------------------------------------
    # 3. Target Host & Storage Self-Healing Preparation
    # --------------------------------------------------------------------------
    - name: Ensure target hosts have Python3, sshpass, lvm2, and Podman installed
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - python3-dbus
          - sshpass
          - lvm2
          - podman
        state: present

    - name: Check if secondary block device (/dev/sdb) exists for Cinder storage
      ansible.builtin.stat:
        path: /dev/sdb
      register: openstack_sdb_disk

    - name: Create Cinder LVM Volume Group (cinder-volumes) automatically if /dev/sdb exists
      ansible.builtin.shell: "vgs cinder-volumes || (pvcreate -f /dev/sdb && vgcreate cinder-volumes /dev/sdb)"
      when: openstack_sdb_disk.stat.exists
      register: openstack_vg_create
      changed_when: "'successfully created' in openstack_vg_create.stdout"

    - name: Create dummy external interface for Neutron if not present
      ansible.builtin.shell: >-
        ip link show {{ openstack_neutron_external_interface }} ||
        (ip link add {{ openstack_neutron_external_interface }} type dummy &&
        ip link set {{ openstack_neutron_external_interface }} up)
      changed_when: false
      failed_when: false

    # --------------------------------------------------------------------------
    # 4. Kolla-Ansible Configuration Generation (Bastion Node)
    # --------------------------------------------------------------------------
    - name: Ensure /etc/kolla configuration directory exists on bastion
      ansible.builtin.file:
        path: /etc/kolla
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Copy default Kolla passwords.yml template if not already present
      ansible.builtin.command: cp /usr/local/share/kolla-ansible/etc_examples/kolla/passwords.yml /etc/kolla/passwords.yml
      args:
        creates: /etc/kolla/passwords.yml
      delegate_to: localhost
      run_once: true

    - name: Render /etc/kolla/globals.yml from OpenIaC template
      ansible.builtin.template:
        src: globals.yml.j2
        dest: /etc/kolla/globals.yml
        mode: "0644"
      delegate_to: localhost
      run_once: true

    - name: Generate secure Kolla passwords (/etc/kolla/passwords.yml)
      ansible.builtin.command: /usr/local/bin/kolla-genpwd
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      delegate_to: localhost
      run_once: true
      changed_when: true

    # --------------------------------------------------------------------------
    # 5. Kolla-Ansible Lifecycle Execution
    # --------------------------------------------------------------------------
    - name: Bootstrap target servers with Kolla-Ansible
      ansible.builtin.command: "/usr/local/bin/kolla-ansible -i {{ inventory_file }} bootstrap-servers"
      delegate_to: localhost
      run_once: true
      environment:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      changed_when: true

    - name: Execute Kolla-Ansible pre-flight checks
      ansible.builtin.command: "/usr/local/bin/kolla-ansible -i {{ inventory_file }} prechecks"
      delegate_to: localhost
      run_once: true
      environment:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      changed_when: false

    - name: Deploy OpenStack cluster with Kolla-Ansible
      ansible.builtin.command: "/usr/local/bin/kolla-ansible -i {{ inventory_file }} deploy"
      delegate_to: localhost
      run_once: true
      environment:
        ANSIBLE_HOST_KEY_CHECKING: "False"
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      changed_when: true

    - name: Generate OpenStack admin credentials (/etc/kolla/admin-openrc.sh)
      ansible.builtin.command: /usr/local/bin/kolla-ansible post-deploy
      environment:
        PATH: "/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      delegate_to: localhost
      run_once: true
      changed_when: true
