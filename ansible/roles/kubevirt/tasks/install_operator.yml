---
# ==============================================================================
# OpenIaC Ansible Role Engine: KubeVirt Install & Upgrade (Operator Standard)
# ==============================================================================
# Deploys or upgrades KubeVirt and CDI onto any Kubernetes (k8s/k3s) or
# OpenShift/OKD cluster. Automatically enables QEMU software emulation when
# hardware KVM (/dev/kvm) is unavailable.

- name: Deploy or Upgrade KubeVirt Cloud-Native Virtualization Stack
  block:
    # --------------------------------------------------------------------------
    # 1. Hardware KVM Check & Self-Healing Emulation Detection
    # --------------------------------------------------------------------------
    - name: Check if hardware virtualization (/dev/kvm) is available on nodes
      ansible.builtin.stat:
        path: /dev/kvm
      register: kubevirt_kvm_device

    # --------------------------------------------------------------------------
    # 2. Air-gapped (Offline) Manifest & CLI Deployment
    # --------------------------------------------------------------------------
    - name: "[Offline] Copy KubeVirt manifests and virtctl CLI to cluster management node"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../packager/artifacts/kubevirt/"
        dest: /tmp/openiac-kubevirt-artifacts/
        mode: "0755"
      when:
        - airgapped_mode | default(false) | bool
        - inventory_hostname == kubevirt_target_node

    - name: "[Offline] Install virtctl CLI binary on cluster management node"
      ansible.builtin.copy:
        src: "/tmp/openiac-kubevirt-artifacts/virtctl-{{ kubevirt_version }}-linux-amd64"
        dest: /usr/local/bin/virtctl
        remote_src: true
        mode: "0755"
      when:
        - airgapped_mode | default(false) | bool
        - inventory_hostname == kubevirt_target_node

    - name: "[Offline] Apply KubeVirt and CDI Operator & CR manifests (Install / Upgrade)"
      ansible.builtin.command: "kubectl apply -f /tmp/openiac-kubevirt-artifacts/{{ item }}"
      environment:
        KUBECONFIG: "{{ kubevirt_kubeconfig_path }}"
      loop:
        - kubevirt-operator.yaml
        - kubevirt-cr.yaml
        - cdi-operator.yaml
        - cdi-cr.yaml
      when:
        - airgapped_mode | default(false) | bool
        - inventory_hostname == kubevirt_target_node
      changed_when: true

    # --------------------------------------------------------------------------
    # 3. Online Manifest & CLI Deployment
    # --------------------------------------------------------------------------
    - name: "[Online] Download and install virtctl CLI binary ({{ kubevirt_version }})"
      ansible.builtin.get_url:
        url: "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/virtctl-{{ kubevirt_version }}-linux-amd64"
        dest: /usr/local/bin/virtctl
        mode: "0755"
      when:
        - not (airgapped_mode | default(false) | bool)
        - inventory_hostname == kubevirt_target_node

    - name: "[Online] Apply KubeVirt and CDI Operator & CR manifests (Install / Upgrade)"
      ansible.builtin.command: "kubectl apply -f {{ item }}"
      environment:
        KUBECONFIG: "{{ kubevirt_kubeconfig_path }}"
      loop:
        - "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/kubevirt-operator.yaml"
        - "https://github.com/kubevirt/kubevirt/releases/download/{{ kubevirt_version }}/kubevirt-cr.yaml"
        - "https://github.com/kubevirt/containerized-data-importer/releases/download/{{ kubevirt_cdi_version }}/cdi-operator.yaml"
        - "https://github.com/kubevirt/containerized-data-importer/releases/download/{{ kubevirt_cdi_version }}/cdi-cr.yaml"
      when:
        - not (airgapped_mode | default(false) | bool)
        - inventory_hostname == kubevirt_target_node
      changed_when: true

    # --------------------------------------------------------------------------
    # 4. Self-Healing Software Emulation Fallback (Nested VM Support)
    # --------------------------------------------------------------------------
    - name: Enable KubeVirt software emulation automatically if /dev/kvm is absent
      ansible.builtin.command: >-
        kubectl patch kubevirt kubevirt -n kubevirt --type merge
        -p '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
      environment:
        KUBECONFIG: "{{ kubevirt_kubeconfig_path }}"
      when:
        - inventory_hostname == kubevirt_target_node
        - kubevirt_auto_emulation_fallback | bool
        - not kubevirt_kvm_device.stat.exists
      changed_when: true

    - name: Wait for KubeVirt deployment to reach Available phase
      ansible.builtin.command: kubectl wait kubevirt.kubevirt.io/kubevirt -n kubevirt --for=condition=Available --timeout=300s
      environment:
        KUBECONFIG: "{{ kubevirt_kubeconfig_path }}"
      when: inventory_hostname == kubevirt_target_node
      changed_when: false

  always:
    - name: Clean up temporary KubeVirt artifact directory
      ansible.builtin.file:
        path: /tmp/openiac-kubevirt-artifacts
        state: absent
      failed_when: false
