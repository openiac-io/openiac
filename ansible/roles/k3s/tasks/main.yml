# ==============================================================================
# OpenIaC Ansible Role Entrypoint: K3s (Lightweight Kubernetes)
# ==============================================================================
# Dynamically dispatches the selected K3s installation engine (e.g., install_binary.yml).

# ------------------------------------------------------------------------------
# 1. Pluggable Installation Engine Dispatch
# ------------------------------------------------------------------------------
- name: "Dispatch K3s installation engine ({{ k3s_install_method }})"
  ansible.builtin.include_tasks: "install_{{ k3s_install_method }}.yml"
