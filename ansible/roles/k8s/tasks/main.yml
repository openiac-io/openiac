---
# ==============================================================================
# OpenIaC Ansible Role Entrypoint: Kubernetes (Standard K8s)
# ==============================================================================
# Validates version compatibility and dynamically dispatches the selected
# installation engine (e.g., install_kubeadm.yml).

# ------------------------------------------------------------------------------
# 1. Pre-flight Version Validation
# ------------------------------------------------------------------------------
- name: Verify minimum supported Kubernetes version (1.28+ required)
  ansible.builtin.assert:
    that:
      - k8s_version is version('1.28', '>=')
    fail_msg: >-
      Unsupported Kubernetes version ({{ k8s_version }}).
      OpenIaC standardizes on Kubernetes 1.28+ (pkgs.k8s.io & containerd generation).
    success_msg: "Verified compatible Kubernetes version: {{ k8s_version }}"
  run_once: true

# ------------------------------------------------------------------------------
# 2. Pluggable Installation Engine Dispatch
# ------------------------------------------------------------------------------
- name: "Dispatch Kubernetes installation engine ({{ k8s_install_method }})"
  ansible.builtin.include_tasks: "install_{{ k8s_install_method }}.yml"
