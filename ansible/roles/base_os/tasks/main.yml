---
# ==============================================================================
# OpenIaC Ansible Role: Base OS Configuration (RHEL / Rocky Linux)
# ==============================================================================
# Prepares Enterprise Linux hosts with required kernel modules, sysctl tuning,
# /etc/hosts cluster resolution, and security baseline adjustments for
# container and cloud platforms.
# Uses strictly built-in Ansible modules for zero external collection dependencies.

# ------------------------------------------------------------------------------
# 1. Pre-flight OS Validation
# ------------------------------------------------------------------------------
- name: Verify target host is running an Enterprise Linux distribution (RHEL/Rocky)
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
    fail_msg: >-
      Unsupported OS detected ({{ ansible_distribution }}).
      OpenIaC strictly standardizes on RHEL / Rocky Linux distributions.
    success_msg: >-
      Verified compatible Enterprise Linux OS: {{ ansible_distribution }} {{ ansible_distribution_version }}

# ------------------------------------------------------------------------------
# 2. Cluster Hostname & Private IP Resolution (/etc/hosts)
# ------------------------------------------------------------------------------
- name: Ensure all cluster inventory nodes are resolvable via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s+{{ item }}$'
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
  loop: "{{ groups['all'] }}"
  when: hostvars[item].ansible_host is defined

# ------------------------------------------------------------------------------
# 3. Memory & Swap Configuration
# ------------------------------------------------------------------------------
- name: Disable active swap memory (Required for Kubernetes kubelet stability)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Disable swap persistence in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

# ------------------------------------------------------------------------------
# 4. Security & Firewall Baseline
# ------------------------------------------------------------------------------
- name: "[Pre-flight] Validate base_os_selinux_mode is enforcing or permissive"
  ansible.builtin.assert:
    that:
      - base_os_selinux_mode in ["enforcing", "permissive"]
    fail_msg: >-
      Unsupported SELinux mode '{{ base_os_selinux_mode }}'.
      OpenIaC only allows 'enforcing' or 'permissive' (never disabled).
    success_msg: "Validated SELinux security baseline mode: {{ base_os_selinux_mode }}"

- name: "Ensure SELinux runtime mode matches baseline ({{ base_os_selinux_mode }})"
  ansible.builtin.command: "setenforce {{ 1 if base_os_selinux_mode == 'enforcing' else 0 }}"
  when:
    - ansible_selinux is defined
    - ansible_selinux.status | default('disabled') == "enabled"
    - ansible_selinux.mode | default('') != base_os_selinux_mode
  changed_when: true

- name: Check whether /etc/selinux/config exists
  ansible.builtin.stat:
    path: /etc/selinux/config
  register: base_os_selinux_config_file

- name: "Persist SELinux baseline mode ({{ base_os_selinux_mode }}) in /etc/selinux/config"
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: "SELINUX={{ base_os_selinux_mode }}"
  when: base_os_selinux_config_file.stat.exists

- name: Check whether firewall-cmd is available on target host
  ansible.builtin.command: which firewall-cmd
  register: base_os_firewalld_bin
  changed_when: false
  failed_when: false

- name: Configure and enable firewalld with least-privilege rules
  when:
    - base_os_firewalld_enabled | bool
    - base_os_firewalld_bin.rc == 0
  block:
    - name: Ensure firewalld service is started and enabled
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Open required platform ports in firewalld
      ansible.builtin.shell: >-
        firewall-cmd --permanent --query-port='{{ item }}' ||
        (firewall-cmd --permanent --add-port='{{ item }}' && echo CHANGED)
      loop: "{{ base_os_firewalld_ports }}"
      register: base_os_firewalld_port_results
      changed_when: "'CHANGED' in (base_os_firewalld_port_results.stdout | default(''))"

    - name: Allow container overlay CIDRs in firewalld trusted zone
      ansible.builtin.shell: >-
        firewall-cmd --permanent --zone=trusted --query-source='{{ item }}' ||
        (firewall-cmd --permanent --zone=trusted --add-source='{{ item }}' && echo CHANGED)
      loop: "{{ base_os_firewalld_trusted_sources }}"
      register: base_os_firewalld_source_results
      changed_when: "'CHANGED' in (base_os_firewalld_source_results.stdout | default(''))"

    - name: Reload firewalld to apply permanent rules
      ansible.builtin.command: firewall-cmd --reload
      when: (base_os_firewalld_port_results is changed) or (base_os_firewalld_source_results is changed)
      changed_when: true

- name: Stop and disable firewalld only when explicitly opted out
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - not (base_os_firewalld_enabled | bool)
    - base_os_firewalld_bin.rc == 0

# ------------------------------------------------------------------------------
# 5. Kernel Modules & Network Sysctl Tuning
# ------------------------------------------------------------------------------
- name: Persist required kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/openiac-cri.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load required kernel modules (overlay, br_netfilter)
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure kernel sysctl parameters for container networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-openiac-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"
  register: base_os_sysctl_config

- name: Reload kernel sysctl parameters
  ansible.builtin.command: sysctl --system
  when: base_os_sysctl_config.changed
  changed_when: true
