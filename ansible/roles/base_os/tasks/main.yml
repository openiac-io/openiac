---
# ==============================================================================
# OpenIaC Base OS Configuration (RHEL/Rocky 9)
# ==============================================================================

- name: Disable SWAP (Required for Kubernetes)
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swapfile from /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Set SELinux to permissive
  selinux:
    policy: targeted
    state: permissive

- name: Ensure firewalld is stopped and disabled
  systemd:
    name: firewalld
    state: stopped
    enabled: false

- name: Load required kernel modules (overlay, br_netfilter)
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
