---
# ==============================================================================
# OpenIaC OpenShift Engine: Agent-Based Installer (OpenShift / OKD 4.12+)
# ==============================================================================
# Generates a self-bootstrapping 'agent.x86_64.iso' image embedding static IP
# (NMState) and built-in cluster VIPs—eliminating external HAProxy and bootstrap VMs.

- name: Execute OpenShift Agent-Based Installer Workflow
  block:
    # --------------------------------------------------------------------------
    # 1. Bastion Dependencies (nmstatectl is required by openshift-install agent)
    # --------------------------------------------------------------------------
    - name: "[Offline] Install local RPM dependencies (nmstate, jq, tar) on bastion"
      ansible.builtin.shell: "dnf install -y --disablerepo='*' {{ playbook_dir }}/../../packager/artifacts/openshift/rpms/*.rpm"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true
      changed_when: true
      failed_when: false

    - name: "[Online] Ensure nmstate, jq, and tar utilities are installed on bastion"
      ansible.builtin.dnf:
        name:
          - nmstate
          - jq
          - tar
        state: present
      when: not (airgapped_mode | default(false) | bool)
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 2. Air-gapped vs Online Binary Installation (openshift-install & oc)
    # --------------------------------------------------------------------------
    - name: "[Offline] Extract openshift-install and oc CLI from local artifacts"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: false
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/../../packager/artifacts/openshift/openshift-install-linux.tar.gz"
        - "{{ playbook_dir }}/../../packager/artifacts/openshift/openshift-client-linux.tar.gz"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true

    - name: "[Online] Download and extract OKD installer and client binaries"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      loop:
        - "https://github.com/okd-project/okd/releases/download/{{ openshift_okd_version }}/openshift-install-linux-{{ openshift_okd_version }}.tar.gz"
        - "https://github.com/okd-project/okd/releases/download/{{ openshift_okd_version }}/openshift-client-linux-{{ openshift_okd_version }}.tar.gz"
      when:
        - not (airgapped_mode | default(false) | bool)
        - openshift_edition == "okd"
      delegate_to: localhost
      run_once: true

    - name: "[Online] Download and extract Red Hat OCP installer and client binaries"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      loop:
        - "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_ocp_version }}/openshift-install-linux.tar.gz"
        - "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_ocp_version }}/openshift-client-linux.tar.gz"
      when:
        - not (airgapped_mode | default(false) | bool)
        - openshift_edition == "ocp"
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 3. Render install-config.yaml & agent-config.yaml and Build Agent ISO
    # --------------------------------------------------------------------------
    - name: Ensure OpenShift Agent workspace directory exists
      ansible.builtin.file:
        path: /opt/openiac-openshift
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Check if Agent ISO and kubeconfig have already been generated
      ansible.builtin.stat:
        path: /opt/openiac-openshift/auth/kubeconfig
      register: openshift_agent_kubeconfig
      delegate_to: localhost
      run_once: true

    - name: Generate SSH keypair on bastion if not present for CoreOS node access
      ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
      args:
        creates: /root/.ssh/id_ed25519.pub
      delegate_to: localhost
      run_once: true

    - name: Read bastion SSH public key for install-config.yaml
      ansible.builtin.command: cat /root/.ssh/id_ed25519.pub
      register: openshift_ssh_pub_key_raw
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Render install-config.yaml into workspace (consumed during ISO creation)
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: /opt/openiac-openshift/install-config.yaml
        mode: "0600"
      when: not openshift_agent_kubeconfig.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Render agent-config.yaml into workspace (consumed during ISO creation)
      ansible.builtin.template:
        src: agent-config.yaml.j2
        dest: /opt/openiac-openshift/agent-config.yaml
        mode: "0600"
      when: not openshift_agent_kubeconfig.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Generate bootable OpenShift Agent ISO (agent.x86_64.iso) and auth credentials
      ansible.builtin.command: /usr/local/bin/openshift-install agent create image --dir=/opt/openiac-openshift
      when: not openshift_agent_kubeconfig.stat.exists
      delegate_to: localhost
      run_once: true
      changed_when: true

    # --------------------------------------------------------------------------
    # 4. Automatic Kubeconfig Setup for Zero-Knowledge UX
    # --------------------------------------------------------------------------
    - name: Ensure .kube directory exists for root on bastion
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Copy generated OpenShift kubeconfig to /root/.kube/config
      ansible.builtin.copy:
        src: /opt/openiac-openshift/auth/kubeconfig
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"
      delegate_to: localhost
      run_once: true
