---
# ==============================================================================
# OpenIaC Ansible Role: OpenShift (Unified OKD & Red Hat OCP)
# ==============================================================================
# Automates bastion preparation, built-in HAProxy load balancing, built-in
# offline mirror registry, and Ignition/cluster bootstrapping for OKD & OCP.

- name: Deploy OpenShift / OKD Cluster (Air-gapped or Online)
  block:
    # --------------------------------------------------------------------------
    # 1. Built-in Helper: Bastion Services (HAProxy Load Balancer & Podman)
    # --------------------------------------------------------------------------
    - name: Ensure bastion host has HAProxy, Podman, and tar utilities installed
      ansible.builtin.dnf:
        name:
          - haproxy
          - podman
          - tar
          - jq
        state: present
      delegate_to: localhost
      run_once: true

    - name: Render built-in HAProxy load balancer configuration for OpenShift API & Ingress
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
      delegate_to: localhost
      run_once: true
      register: openshift_haproxy_cfg

    - name: Allow HAProxy to bind to non-standard ports in SELinux
      ansible.builtin.command: setsebool -P haproxy_connect_any 1
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: false

    - name: Enable and restart built-in HAProxy service on bastion
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
        enabled: true
      when: openshift_haproxy_cfg.changed
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 2. Air-gapped vs Online Binary Installation (openshift-install & oc)
    # --------------------------------------------------------------------------
    - name: "[Offline] Extract openshift-install and oc CLI from local artifacts"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: false
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/../../packager/artifacts/openshift/openshift-install-linux.tar.gz"
        - "{{ playbook_dir }}/../../packager/artifacts/openshift/openshift-client-linux.tar.gz"
      when: airgapped_mode | default(false) | bool
      delegate_to: localhost
      run_once: true

    - name: "[Online] Download and extract OKD installer and client binaries"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      loop:
        - "https://github.com/okd-project/okd/releases/download/{{ openshift_okd_version }}/openshift-install-linux-{{ openshift_okd_version }}.tar.gz"
        - "https://github.com/okd-project/okd/releases/download/{{ openshift_okd_version }}/openshift-client-linux-{{ openshift_okd_version }}.tar.gz"
      when:
        - not (airgapped_mode | default(false) | bool)
        - openshift_edition == "okd"
      delegate_to: localhost
      run_once: true

    - name: "[Online] Download and extract Red Hat OCP installer and client binaries"
      ansible.builtin.unarchive:
        src: "{{ item }}"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      loop:
        - "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_ocp_version }}/openshift-install-linux.tar.gz"
        - "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_ocp_version }}/openshift-client-linux.tar.gz"
      when:
        - not (airgapped_mode | default(false) | bool)
        - openshift_edition == "ocp"
      delegate_to: localhost
      run_once: true

    # --------------------------------------------------------------------------
    # 3. Ignition & Install-Config Generation
    # --------------------------------------------------------------------------
    - name: Ensure OpenShift installation workspace directory exists
      ansible.builtin.file:
        path: /opt/openiac-openshift
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Check if OpenShift Ignition configs have already been generated
      ansible.builtin.stat:
        path: /opt/openiac-openshift/auth/kubeconfig
      register: openshift_kubeconfig_stat
      delegate_to: localhost
      run_once: true

    - name: Generate SSH keypair on bastion if not present for CoreOS node access
      ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
      args:
        creates: /root/.ssh/id_ed25519.pub
      delegate_to: localhost
      run_once: true

    - name: Read bastion SSH public key for install-config.yaml
      ansible.builtin.command: cat /root/.ssh/id_ed25519.pub
      register: openshift_ssh_pub_key_raw
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Render OpenShift install-config.yaml from template
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: /opt/openiac-openshift/install-config.yaml
        mode: "0600"
      when: not openshift_kubeconfig_stat.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Generate OpenShift Ignition configs and kubeconfig
      ansible.builtin.command: /usr/local/bin/openshift-install create ignition-configs --dir=/opt/openiac-openshift
      when: not openshift_kubeconfig_stat.stat.exists
      delegate_to: localhost
      run_once: true
      changed_when: true

    # --------------------------------------------------------------------------
    # 4. Post-Generation Kubeconfig Setup for Zero-Knowledge UX
    # --------------------------------------------------------------------------
    - name: Ensure .kube directory exists for root on bastion
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Copy generated OpenShift kubeconfig to /root/.kube/config
      ansible.builtin.copy:
        src: /opt/openiac-openshift/auth/kubeconfig
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"
      delegate_to: localhost
      run_once: true
