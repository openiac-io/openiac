---
# ==============================================================================
# OpenIaC Ansible Role Entrypoint: OpenShift (OKD / Red Hat OCP)
# ==============================================================================
# Acts as a lightweight router that validates version compatibility and
# dynamically dispatches the selected installation engine (e.g., install_agent.yml).

# ------------------------------------------------------------------------------
# 1. Pre-flight Version & Engine Validation
# ------------------------------------------------------------------------------
- name: Determine effective OpenShift release version string
  ansible.builtin.set_fact:
    openshift_effective_version: >-
      {{ (openshift_edition == 'ocp') | ternary(openshift_ocp_version, openshift_okd_version) }}
  run_once: true

- name: Verify minimum supported OpenShift / OKD version (4.12+ required)
  ansible.builtin.assert:
    that:
      - openshift_effective_version is version('4.12', '>=')
    fail_msg: >-
      Unsupported OpenShift/OKD version ({{ openshift_effective_version }}).
      OpenIaC standardizes on OpenShift 4.12+ (RHEL 9 generation).
    success_msg: >-
      Verified compatible OpenShift/OKD version: {{ openshift_effective_version }} ({{ openshift_edition | upper }})
  run_once: true

# ------------------------------------------------------------------------------
# 2. Pluggable Installation Engine Dispatch
# ------------------------------------------------------------------------------
- name: "Dispatch OpenShift installation engine ({{ openshift_install_method }})"
  ansible.builtin.include_tasks: "install_{{ openshift_install_method }}.yml"
