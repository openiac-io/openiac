---
# ==============================================================================
# OpenIaC Playbook: Standard Upstream Kubernetes (K8s) & Optional Layer-3 Add-ons
# ==============================================================================
- name: OpenIaC - Upstream Kubernetes (Kubeadm) Cluster Deployment
  hosts: all
  become: true
  roles:
    - role: base_os
    - role: k8s
    - role: kubevirt
      when: enable_kubevirt_addon | default(false) | bool
