---
# ==============================================================================
# OpenIaC Playbook: OpenShift / OKD Container Platform & Optional Layer-3 Add-ons
# ==============================================================================
- name: OpenIaC - OpenShift / OKD Cluster Deployment
  hosts: all
  become: true
  roles:
    - role: base_os
    - role: openshift
    - role: kubevirt
      when: enable_kubevirt_addon | default(false) | bool
