---
# ==============================================================================
# OpenIaC Playbook: Lightweight Kubernetes (K3s) & Optional Layer-3 Add-ons
# ==============================================================================
- name: OpenIaC - K3s Cluster Deployment
  hosts: all
  become: true
  roles:
    - role: base_os
      vars:
        base_os_firewalld_ports:
          - "6443/tcp"
          - "10250/tcp"
          - "8472/udp"
          - "2379-2380/tcp"
        base_os_firewalld_trusted_sources:
          - "10.42.0.0/16"
          - "10.43.0.0/16"
    - role: k3s
    - role: kubevirt
      when: enable_kubevirt_addon | default(false) | bool
