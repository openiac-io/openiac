---
# ==============================================================================
# OpenIaC Playbook: Lightweight Kubernetes (K3s) & Optional Layer-3 Add-ons
# ==============================================================================
- name: OpenIaC - K3s Cluster Deployment
  hosts: all
  become: true
  roles:
    - role: base_os
    - role: k3s
    - role: kubevirt
      when: enable_kubevirt_addon | default(false) | bool
