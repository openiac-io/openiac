---
# ==============================================================================
# OpenIaC Playbook: OpenStack Private Cloud (Kolla-Ansible)
# ==============================================================================
- name: OpenIaC - OpenStack Kolla-Ansible Deployment
  hosts: all
  become: true
  roles:
    - role: base_os
      vars:
        # Upstream Kolla-Ansible bootstrap-servers defaults to permissive SELinux
        # for container named-volume relabeling while keeping firewalld enabled.
        base_os_selinux_mode: "permissive"
        base_os_firewalld_enabled: true
    - role: openstack
